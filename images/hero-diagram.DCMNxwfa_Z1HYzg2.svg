<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8fafc"/>

  <!-- Edge connections (drawn first, behind nodes) -->
  <!-- Spine to Leaf connections -->
  <path d="M200 60 L100 140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 60 L200 140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 60 L300 140" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Leaf to Server connections -->
  <path d="M100 140 L70 220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 140 L130 220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 140 L170 220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 140 L230 220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 140 L270 220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M300 140 L330 220" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Highlighted path -->
  <path d="M70 220 L100 140 L200 60 L300 140 L330 220"
        stroke="#0072b2" stroke-width="3" stroke-linecap="round"
        fill="none" stroke-dasharray="none"/>

  <!-- Spine node (router) -->
  <circle cx="200" cy="60" r="20" fill="#0072b2" stroke="#005a8c" stroke-width="2"/>
  <text x="200" y="65" text-anchor="middle" fill="white" font-size="10" font-family="system-ui">R</text>

  <!-- Leaf nodes (switches) -->
  <rect x="80" y="125" width="40" height="30" rx="4" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" fill="white" font-size="10" font-family="system-ui">SW</text>

  <rect x="180" y="125" width="40" height="30" rx="4" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="200" y="145" text-anchor="middle" fill="white" font-size="10" font-family="system-ui">SW</text>

  <rect x="280" y="125" width="40" height="30" rx="4" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="300" y="145" text-anchor="middle" fill="white" font-size="10" font-family="system-ui">SW</text>

  <!-- Server nodes -->
  <rect x="55" y="210" width="30" height="25" rx="2" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <rect x="115" y="210" width="30" height="25" rx="2" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <rect x="155" y="210" width="30" height="25" rx="2" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <rect x="215" y="210" width="30" height="25" rx="2" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <rect x="255" y="210" width="30" height="25" rx="2" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>
  <rect x="315" y="210" width="30" height="25" rx="2" fill="#6366f1" stroke="#4f46e5" stroke-width="2"/>

  <!-- Labels -->
  <text x="200" y="25" text-anchor="middle" fill="#334155" font-size="11" font-family="system-ui" font-weight="500">Spine</text>
  <text x="40" y="145" text-anchor="middle" fill="#334155" font-size="10" font-family="system-ui">Leaf</text>
  <text x="360" y="145" text-anchor="middle" fill="#334155" font-size="10" font-family="system-ui">Leaf</text>
  <text x="200" y="265" text-anchor="middle" fill="#334155" font-size="10" font-family="system-ui">Servers</text>

  <!-- Path legend -->
  <line x1="30" y1="285" x2="60" y2="285" stroke="#0072b2" stroke-width="3"/>
  <text x="70" y="288" fill="#334155" font-size="9" font-family="system-ui">Traffic Path</text>
</svg>
